[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spartment-pipeline"
version = "0.1.0"
description = "Spartment apartment management ETL pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
airflow = ["apache-airflow>=2.7"]
load = ["psycopg[binary]>=3.2,<4", "tzdata; sys_platform == 'win32'"]

[project.scripts]
spartment-extract = "spartment.stage1_extract.cli:main"
spartment-transform = "spartment.stage2_transform.cli:main"
spartment-transform-retain = "spartment.stage2_transform.retention:main"
spartment-retain = "spartment.common.retention:main"
spartment-load = "spartment.stage3_load.cli:main"
spartment-load-retain = "spartment.stage3_load.retention:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["spartment*"]
